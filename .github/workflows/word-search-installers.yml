# בניית קובצי ההתקנה של "חיפוש במסמכים" (word-search/) לחלונות, מק ולינוקס.
# בכל מערכת: בדיקות יחידה → בנייה → בדיקה עצמית של התוכנה הארוזה → העלאת ההתקנה.
# תג בשם word-search-v<גרסה> יוצר גם Release להורדה.
name: word-search installers

on:
  push:
    # חובה לציין גם branches: כשמופיע רק tags, דחיפה לענף לא מפעילה את הבנייה בכלל
    branches:
      - "**"
      - "!ci-screenshots"
    tags:
      - "word-search-v*"
    # מסנן הנתיבים חל על ענפים בלבד (בדחיפת תג GitHub לא בודק נתיבים)
    paths:
      - "word-search/**"
      - ".github/workflows/word-search-installers.yml"
  workflow_dispatch:

permissions:
  contents: write

# דחיפה חדשה לאותו ענף מבטלת בנייה קודמת שעוד רצה
concurrency:
  group: word-search-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, optional: false }
          - { os: macos-latest, name: macos-apple-silicon, optional: false }
          - { os: macos-15-intel, name: macos-intel, optional: true }
          - { os: ubuntu-22.04, name: linux, optional: false }
    defaults:
      run:
        working-directory: word-search
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: word-search/requirements.txt

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 fonts-dejavu-core

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # בניית תוסף VSTO ל-Word דורשת במחשב הבנייה את Visual Studio 2010 Tools for Office Runtime
      # (חבילת Chocolatey שמורידה את ההתקנה הרשמית של Microsoft)
      - name: VSTO runtime (Windows, for building the Word add-in)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installed = (Test-Path "HKLM:\SOFTWARE\Microsoft\VSTO Runtime Setup\v4R") -or (Test-Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\VSTO Runtime Setup\v4R")
          if (-not $installed) { choco install vstor2010 --no-progress -y }

      - name: Build installer (includes self-test of the packaged app)
        run: python packaging/build.py

      # תמונות של חלונית התוסף ל-Word (בדיקת עיצוב בלי Word)
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: word-addin-pane-preview
          path: word-search/build/pane-preview/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: HebDocSearch-${{ matrix.name }}
          path: |
            word-search/dist/*.exe
            word-search/dist/*.dmg
            word-search/dist/*.tar.gz
          if-no-files-found: error

  release:
    # נוצר Release בשני מקרים: דחיפת תג word-search-v*, או דחיפה לענף עם [release] בהודעת ה-commit
    if: startsWith(github.ref, 'refs/tags/word-search-v') || contains(github.event.head_commit.message, '[release]')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: word-search/hebsearch/__init__.py
          sparse-checkout-cone-mode: false

      - name: Release tag name
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            v=$(grep -oP '__version__ = "\K[^"]+' word-search/hebsearch/__init__.py)
            echo "name=word-search-v${v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: חיפוש במסמכים ${{ steps.tag.outputs.name }}
          files: out/*
          body: |
            קובצי ההתקנה של "חיפוש במסמכים":
            * **חלונות** – `HebDocSearch-Setup-*.exe` (אשף התקנה בעברית)
            * **מק** – `*-macOS-arm64.dmg` (Apple Silicon, M1 ומעלה) / `*-macOS-x86_64.dmg` (אינטל)
            * **לינוקס** – `*-linux-x86_64.tar.gz` (לחלץ ולהריץ `./install.sh`)

            בהפעלה הראשונה חלונות עשויה להציג "Windows protected your PC" – לוחצים "More info" ← "Run anyway".

      # קישור קבוע שתמיד מוריד את הגרסה האחרונה, בלי מספר גרסה בכתובת:
      #   https://github.com/<owner>/<repo>/releases/download/word-search-latest/HebDocSearch-Setup.exe
      # (Release נפרד שהקבצים בו מוחלפים בכל גרסה; מסומן "טרום-הפצה" כדי לא להפוך ל-"latest" של המאגר)
      - name: Version-less copies for the permanent link
        run: |
          mkdir -p latest
          for f in out/*; do
            n=$(basename "$f")
            n=$(echo "$n" | sed -E 's/-[0-9]+(\.[0-9]+)+//')
            cp "$f" "latest/$n"
          done
          ls -la latest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: word-search-latest
          target_commitish: ${{ github.sha }}
          name: חיפוש במסמכים – הגרסה האחרונה (קישור קבוע)
          prerelease: true
          files: latest/*
          body: |
            הקבצים כאן מתחלפים אוטומטית בכל גרסה חדשה (עכשיו: ${{ steps.tag.outputs.name }}).
            קישור קבוע להתקנה בחלונות:
            https://github.com/${{ github.repository }}/releases/download/word-search-latest/HebDocSearch-Setup.exe
