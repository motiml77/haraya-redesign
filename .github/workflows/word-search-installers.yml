# בניית קובצי ההתקנה של "חיפוש במסמכים" (word-search/) לחלונות, מק ולינוקס.
# בכל מערכת: בדיקות יחידה → בנייה → בדיקה עצמית של התוכנה הארוזה → העלאת ההתקנה.
# תג בשם word-search-v<גרסה> יוצר גם Release להורדה.
name: word-search installers

on:
  push:
    # חובה לציין גם branches: כשמופיע רק tags, דחיפה לענף לא מפעילה את הבנייה בכלל
    branches:
      - "**"
    tags:
      - "word-search-v*"
    # מסנן הנתיבים חל על ענפים בלבד (בדחיפת תג GitHub לא בודק נתיבים)
    paths:
      - "word-search/**"
      - ".github/workflows/word-search-installers.yml"
  workflow_dispatch:

permissions:
  contents: write

# דחיפה חדשה לאותו ענף מבטלת בנייה קודמת שעוד רצה
concurrency:
  group: word-search-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, optional: false }
          - { os: macos-latest, name: macos-apple-silicon, optional: false }
          - { os: macos-15-intel, name: macos-intel, optional: true }
          - { os: ubuntu-22.04, name: linux, optional: false }
    defaults:
      run:
        working-directory: word-search
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: word-search/requirements.txt

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 fonts-dejavu-core

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer (includes self-test of the packaged app)
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: HebDocSearch-${{ matrix.name }}
          path: |
            word-search/dist/*.exe
            word-search/dist/*.dmg
            word-search/dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/word-search-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: חיפוש במסמכים ${{ github.ref_name }}
          files: out/*
          body: |
            קובצי ההתקנה של "חיפוש במסמכים":
            * **חלונות** – `HebDocSearch-Setup-*.exe` (אשף התקנה בעברית)
            * **מק** – `*-macOS-arm64.dmg` (Apple Silicon) / `*-macOS-x86_64.dmg` (אינטל)
            * **לינוקס** – `*-linux-x86_64.tar.gz` (לחלץ ולהריץ `install.sh`)
