# זמני: מדפיס את התבנית הרשמית של Visual Studio לתוסף VSTO ל-Word (מותקנת על מכונת הבנייה),
# כדי לבנות את התוסף על בסיס הקבצים הרשמיים. יימחק אחרי השימוש.
name: vsto template probe
on:
  push:
    branches: ["ccr-*"]
    paths: [".github/workflows/vsto-template-probe.yml"]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Print the Word VSTO add-in template (C#)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $t = Get-ChildItem -Path "$vs\Common7\IDE\ProjectTemplates" -Recurse -Filter WordAddIn.vstemplate -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'CSharp' } | Select-Object -First 1
          Write-Host "TEMPLATE DIR: $($t.DirectoryName)"
          Get-ChildItem $t.DirectoryName -File | Where-Object { $_.Name -notmatch 'csproj|vstemplate' } | ForEach-Object {
            Write-Host "=================== FILE: $($_.Name)"
            Get-Content $_.FullName -Raw | Write-Host
          }
